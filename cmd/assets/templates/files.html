<!doctype html>
<html></html>
<body>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Size</th>
        <th>Modified</th>
      </tr>
    </thead>
    <tbody>
      {{range .}}
      <tr>
        <td>
          {{if .Link}}
            <a href="{{.Link}}" target="_blank">{{.Name}}</a>
          {{else}}
            <a href="relatorios/{{if .IsDir}}/{{.Name}}{{else}}{{.Name}}{{end}}"
              >{{.Name}}</a
            >
          {{end}}
        </td>
        <td class="right">{{if .IsDir}}-{{else}}{{.Size}}{{end}}</td>
        <td class="center">{{.ModTime}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</body>
